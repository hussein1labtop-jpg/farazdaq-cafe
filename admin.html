<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>إدارة كافتريا الفرزدق</title>

<body class="admin" data-m="admin">

<div id="ap" hidden><header><img src="icons/admin-192.png"><h1 id="hi">إدارة كافتريا الفرزدق</h1><button id="ib" hidden onclick="inst()">📲</button><button onclick="$('or').hidden=false">📋<b id="nb" hidden></b></button><button onclick="$('ns').hidden=false">💬<b id="ub" hidden></b></button><button onclick="$('ac').hidden=false">💰</button><button onclick="openB()">📢</button><button onclick="logout()">🚪</button></header>
<div id="bn" hidden></div><div id="tabs"></div><div id="list"></div>
<footer class="sig">Made by <a href="https://hussein1labtop-jpg.github.io/Profile-/" target="_blank" rel="noopener">Hussein</a></footer></div>
<div id="em" class="modal" hidden onclick="if(event.target==this)this.hidden=true"><div class="sheet"><h3 id="et"></h3>
<label class="ph"><img id="pv" hidden><span>📷 اضغط لإضافة صورة</span><input type="file" accept="image/*" hidden onchange="pick(this)"></label>
<input id="en" placeholder="اسم المنتج"><input id="ep" type="number" inputmode="numeric" placeholder="السعر (د.ع)"><input id="ed" placeholder="تفاصيل (اختياري)">
<select id="eg" onchange="kp()"></select><label id="ekw" class="ck" hidden><input type="checkbox" id="ek">📌 ثابت (يبقى كل يوم، بدون مسح تلقائي)</label>
<button class="btn big" onclick="savep()">حفظ</button></div></div>
<div id="or" class="full" hidden><div class="top"><b>📋 الطلبات</b><button onclick="$('or').hidden=true">✕</button></div>
<div class="card"><input id="q" placeholder="ابحث برقم الطلب أو اسم الطالب" oninput="rO()"><select id="dy" onchange="rO()"><option value="today">طلبات اليوم</option><option value="all">كل الطلبات</option></select><select id="st" onchange="rO()"><option value="all">كل الحالات</option><option value="new">جديد</option><option value="paid">مدفوع</option><option value="cancel">ملغي</option></select></div><div id="ol"></div></div>
<div id="ac" class="full" hidden><div class="top"><b>💰 المحاسبة</b><button onclick="$('ac').hidden=true">✕</button></div>

<div class="grid" id="sg"></div><div class="card"><h3>حسب اليوم</h3><div id="dt"></div></div><div class="card"><h3>أكثر المنتجات مبيعاً</h3><div id="tp"></div></div></div><div id="ns" class="full" hidden><div class="top"><b>💬 الملاحظات</b><button onclick="$('ns').hidden=true">✕</button></div><div id="nal"></div></div>

<div id="toast" hidden></div>

<script src="config.js"></script><script src="app.js"></script></body></html>
